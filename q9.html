<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            background-color: antiquewhite;
            margin: 20px;
        }
        .box1{
            background: linear-gradient(to right, blue, skyblue, rgb(255, 255, 185));
        }
        .box2{
            background: radial-gradient(red, pink, darkred);
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
</body>
</html>
